# PUBLIC repo: build a publikace PRODUKČNÍ verze na GitHub Pages
#   tag vX.Y.Z → kanál stable (veřejná aktualizace pro zákazníky)
name: Release firmware

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: pip install "esphome==2026.10.1"

      - name: Version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          esphome -s fw_version "${{ steps.v.outputs.version }}" -s update_channel stable compile rohus-iri.yaml
          python3 make_manifest.py .esphome/build/rohus-iri out/stable "${{ steps.v.outputs.version }}" stable
          cp index.html out/index.html

      - name: Publish to GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          keep_files: true

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/stable/rohus-iri.factory.bin
