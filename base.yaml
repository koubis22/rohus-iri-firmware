# Základ: ESP32-C3, uvolnění resetu MCP, síť, API, stavová LED
esphome:
  on_boot:
    priority: 1000                # uvolnit reset MCP DŘÍV, než se inicializuje MCP23017 (900)
    then:
      - lambda: |-
          gpio_reset_pin(GPIO_NUM_5);
          gpio_set_direction(GPIO_NUM_5, GPIO_MODE_OUTPUT);
          gpio_set_level(GPIO_NUM_5, 1);

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: esp-idf

logger:                           # USB_SERIAL_JTAG – UART0 (GPIO21) je WiFi LED
  level: INFO

api:
  encryption: {}                  # bez pevného klíče – klíč lze nastavit za běhu

safe_mode:

wifi:
  ap:
    ssid: "Rohus-IRI-Setup"       # nastavovací AP, když WiFi není nakonfigurovaná

captive_portal:

improv_serial:                    # nastavení WiFi z instalační stránky (ESP Web Tools)

# Modrá LED (D6 = GPIO21):
#   bliká (1 Hz)   = připojuje se (k WiFi, nebo už k WiFi a čeká na Home Assistant)
#   svítí trvale   = WiFi i Home Assistant připojené, data běží
#   nesvítí        = WiFi není: jednotka se nepřipojila a běží nastavovací AP
#                    „Rohus-IRI-Setup“ (WiFi nenastavená nebo síť nedostupná)
output:
  - platform: gpio
    id: wifi_led
    pin: GPIO21

globals:
  - id: wifi_led_blink
    type: bool
    restore_value: false
    initial_value: "false"

interval:
  - interval: 500ms
    then:
      - lambda: |-
          auto *wifi = wifi::global_wifi_component;
          bool wifi_ok = wifi->is_connected();
          bool ha_ok = api::global_api_server->is_connected();
          if (wifi_ok && ha_ok) {
            id(wifi_led).turn_on();                    // vše připojeno
          } else if (!wifi_ok && wifi->is_ap_active()) {
            id(wifi_led).turn_off();                   // bez WiFi, nastavovací AP
          } else {
            id(wifi_led_blink) = !id(wifi_led_blink);  // připojuje se
            if (id(wifi_led_blink)) {
              id(wifi_led).turn_on();
            } else {
              id(wifi_led).turn_off();
            }
          }

i2c:
  sda: GPIO6                      # D4
  scl: GPIO7                      # D5
  frequency: 100kHz
  scan: true

mcp23017:
  - id: mcp
    address: 0x20                 # A0–A2 na GND
